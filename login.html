<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://jslatnacsucmwhkgqpkr.supabase.co">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Level Up AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            overflow: hidden; /* Prevent scrolling on desktop auth page */
        }
        
        .auth-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Left Side: Branding / Graphic */
        .auth-brand {
            flex: 1;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        /* Advanced Animated Backgrounds */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: 0;
            animation: floatOrb 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-1 {
            width: 600px; height: 600px;
            background: rgba(0, 240, 255, 0.15);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px; height: 500px;
            background: rgba(112, 0, 255, 0.15);
            bottom: -50px; right: -50px;
            animation-delay: -5s;
            animation-direction: alternate-reverse;
        }

        .orb-3 {
            width: 400px; height: 400px;
            background: rgba(0, 255, 136, 0.1);
            top: 40%; left: 30%;
            animation-delay: -10s;
        }

        @keyframes floatOrb {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 0.4; }
            33% { transform: scale(1.1) translate(30px, -40px) rotate(45deg); opacity: 0.6; }
            66% { transform: scale(0.9) translate(-20px, 30px) rotate(90deg); opacity: 0.5; }
            100% { transform: scale(1.2) translate(40px, 20px) rotate(135deg); opacity: 0.4; }
        }

        .animated-grid-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 0;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
            animation: gridPan 30s linear infinite;
        }

        @keyframes gridPan {
            0% { background-position: 0 0; }
            100% { background-position: 30px 30px; }
        }

        .glass-morph {
            position: absolute;
            width: 400px; height: 400px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            z-index: 1;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: morphGlass 15s ease-in-out infinite alternate;
        }

        @keyframes morphGlass {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; transform: translate(-45%, -55%) rotate(45deg) scale(1.05); }
            100% { border-radius: 50% 50% 60% 40% / 60% 40% 50% 60%; transform: translate(-55%, -45%) rotate(90deg) scale(0.95); }
        }

        .brand-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 500px;
            transform: translateZ(10px);
        }

        .brand-logo {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0;
            animation: slideDownFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-content h2 {
            opacity: 0;
            animation: slideDownFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        /* Right Side: Form */
        .auth-form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            padding: 40px;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        /* Custom Tabs with Sliding Indicator */
        .auth-tabs {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--border-radius-pill);
            padding: 5px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .auth-tab-indicator {
            position: absolute;
            top: 5px;
            left: 5px;
            height: calc(100% - 10px);
            width: calc(50% - 5px);
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            border-radius: var(--border-radius-pill);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 0;
            box-shadow: 0 4px 15px rgba(0, 85, 255, 0.3);
        }

        .auth-tabs[data-active="register"] .auth-tab-indicator {
            transform: translateX(100%);
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            z-index: 1;
            transition: color 0.4s ease;
        }

        .auth-tab.active {
            color: white;
        }

        /* Form Staggered Animations */
        .stagger-item {
            opacity: 0;
            transform: translateY(10px);
        }

        .auth-card > .stagger-item {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .form-section .stagger-item {
            animation: none;
        }

        .form-section.active .stagger-item {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .form-section.active .stagger-item:nth-child(1) { animation-delay: 0.1s; }
        .form-section.active .stagger-item:nth-child(2) { animation-delay: 0.15s; }
        .form-section.active .stagger-item:nth-child(3) { animation-delay: 0.2s; }
        .form-section.active .stagger-item:nth-child(4) { animation-delay: 0.25s; }
        .form-section.active .stagger-item:nth-child(5) { animation-delay: 0.3s; }
        .form-section.active .stagger-item:nth-child(6) { animation-delay: 0.35s; }

        /* Inputs with Icons */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .input-wrapper i.icon {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease;
            font-size: 1.1rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 10px 12px 35px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        /* Animated underline on focus */
        .input-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }

        .input-wrapper input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.02);
        }

        .input-wrapper input:focus ~ i.icon {
            color: var(--primary);
        }

        .input-wrapper input:focus::after,
        .input-wrapper:focus-within::after {
            width: 100%;
        }

        .password-toggle {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--text-primary);
        }

        /* Checkbox & Links */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .checkbox-container:hover {
            color: var(--text-primary);
        }

        .checkbox-container input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-link:hover {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            transform: translateY(-1px);
            display: inline-block;
        }

        /* Form button styling is globally handled by .btn-glow in style.css */

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider:not(:empty)::before { margin-right: 1em; }
        .divider:not(:empty)::after { margin-left: 1em; }

        /* Social Buttons */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Applying the global liquid glass button style to social */
        .social-btn {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            padding: 12px;
            border-radius: var(--border-radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* Top Actions Container */
        .top-actions {
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
        }

        /* Back Button */
        .back-btn {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            color: white;
            transform: translateX(-5px);
        }

        .auth-theme-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-theme-btn:hover {
            color: white;
            transform: rotate(15deg);
        }

        /* Form Visibility Toggle */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        /* Keyframes */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideRightFade {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .auth-brand { display: none; }
            body { overflow: auto; }
            .auth-card { padding-top: 40px; }
            .top-actions { right: 20px; top: 20px; }
        }
    </style>
</head>
<body>
<script>
    if (localStorage.getItem('levelup_theme') === 'light' || (!localStorage.getItem('levelup_theme') && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.body.classList.add('light-mode');
    }
</script>

    <div class="auth-layout">
        
        <!-- Left Branding Area (Hidden on Mobile) -->
        <div class="auth-brand">
            <!-- Hyperistic Animated Background Elements -->
            <div class="auth-brand-bg" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none;">
                <div class="glow-orb orb-1"></div>
                <div class="glow-orb orb-2"></div>
                <div class="glow-orb orb-3"></div>
                <div class="glass-morph"></div>
                <div class="animated-grid-overlay"></div>
            </div>

            <div class="brand-content">
                <div class="logo brand-logo" style="font-weight: 900; letter-spacing: 1px; font-size: 4rem;">LevelUP<span style="color: #00e5ff;">.AI</span></div>
                <h2 class="mb-4 text-gradient" style="font-size: 2.5rem; line-height: 1.2;">Your Career,<br>Supercharged.</h2>
            </div>
        </div>

        <!-- Right Form Area -->
        <div class="auth-form-container">
            <div class="top-actions">
                <button class="theme-toggle-btn auth-theme-btn" title="Toggle Theme"></button>
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
            </div>
            
            <div class="auth-card">
                <div class="auth-tabs" data-active="login" id="authTabsContainer">
                    <div class="auth-tab-indicator"></div>
                    <div class="auth-tab active" onclick="switchTab('login')" id="tab-login">Sign In</div>
                    <div class="auth-tab" onclick="switchTab('register')" id="tab-register">Create Account</div>
                </div>

                <!-- Login Form -->
                <div id="form-login" class="form-section active">
                    <div class="stagger-item" style="text-align: center;">
                        <h2 class="mb-1">Welcome Back</h2>
                        <p class="text-secondary mb-4" style="font-size: 0.95rem;">Enter your credentials to access your dashboard.</p>
                    </div>

                    <form onsubmit="handleAuth(event, 'login')" autocomplete="off">
                        <div class="input-group stagger-item">
                            <div class="input-wrapper">
                                <i class="fa-regular fa-envelope icon"></i>
                                <input type="email" placeholder="Email Address" required autocomplete="off">
                            </div>
                        </div>

                        <div class="input-group stagger-item">
                            <div class="input-wrapper">
                                <i class="fa-solid fa-lock icon"></i>
                                <input type="password" id="loginPass" placeholder="Password" required autocomplete="new-password">
                                <button type="button" class="password-toggle" onclick="togglePassword('loginPass')">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-options stagger-item">
                            <label class="checkbox-container">
                                <input type="checkbox" checked>
                                Remember me
                            </label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn-glow primary stagger-item" style="width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem;">
                            Sign In
                        </button>
                    </form>
                </div>

                <!-- Register Form -->
                <div id="form-register" class="form-section">
                    <div class="stagger-item" style="text-align: center;">
                        <h2 class="mb-1">Start Your Journey</h2>
                        <p class="text-secondary mb-4" style="font-size: 0.95rem;">Create an account to level up your skills.</p>
                    </div>

                    <form onsubmit="handleAuth(event, 'register')" autocomplete="off">
                        <div class="stagger-item" style="display: flex; gap: 15px; margin-bottom: 25px;">
                            <div class="input-wrapper" style="flex: 1;">
                                <i class="fa-regular fa-id-card icon"></i>
                                <input type="text" placeholder="Full Name" required autocomplete="off">
                            </div>
                            <div class="input-wrapper" style="flex: 1;">
                                <i class="fa-solid fa-at icon"></i>
                                <input type="text" placeholder="Username" required autocomplete="off">
                            </div>
                        </div>

                        <div class="input-group stagger-item">
                            <div class="input-wrapper">
                                <i class="fa-regular fa-envelope icon"></i>
                                <input type="email" placeholder="Email Address" required autocomplete="off">
                            </div>
                        </div>

                        <div class="input-group stagger-item">
                            <div class="input-wrapper">
                                <i class="fa-solid fa-lock icon"></i>
                                <input type="password" id="regPass" placeholder="Create Password" required autocomplete="new-password">
                                <button type="button" class="password-toggle" onclick="togglePassword('regPass')">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-glow primary stagger-item" style="width: 100%; justify-content: center; padding: 14px; font-size: 1.05rem; margin-top: 10px;">
                            Create Account
                        </button>
                    </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/app.js"></script>
    <script>
        function switchTab(tab) {
            // Update Tab Indicator Position
            document.getElementById('authTabsContainer').setAttribute('data-active', tab);

            // Update Text Color
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById(`tab-${tab}`).classList.add('active');

            // Force reflow to re-trigger staggered animations
            const currentForm = document.querySelector('.form-section.active');
            if (currentForm) {
                currentForm.classList.remove('active');
            }
            
            const nextForm = document.getElementById(`form-${tab}`);
            // Small timeout allows the DOM to hide the old form before showing the new one, resetting animations
            setTimeout(() => {
                nextForm.classList.add('active');
            }, 10);
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');
            
            // Add a small rotation animation to the icon
            icon.style.transform = "translateY(-50%) rotate(180deg)";
            icon.style.opacity = "0";
            
            setTimeout(() => {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
                icon.style.transform = "translateY(-50%) rotate(0deg)";
                icon.style.opacity = "1";
            }, 150);
        }

        async function handleAuth(e, type) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.style.opacity = '0.9';
            btn.style.transform = 'scale(0.98)';
            btn.disabled = true;
            
            try {
                if (type === 'login') {
                    const email = form.querySelector('input[type="text"], input[type="email"]').value;
                    const password = form.querySelector('input[type="password"]').value;
                    
                    const { data, error } = await window.db.auth.signInWithPassword({
                        email, password
                    });
                    if (error) throw error;
                    
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else if (type === 'register') {
                    const email = form.querySelector('input[type="email"]').value;
                    const password = form.querySelector('input[type="password"]').value;
                    const fullName = form.querySelector('input[type="text"]').value;
                    
                    const { data, error } = await window.db.auth.signUp({
                        email, password,
                        options: {
                            data: {
                                name: fullName
                            }
                        }
                    });
                    if (error) throw error;
                    
                    showToast('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                }
            } catch (error) {
                showToast(error.message || 'Authentication failed', 'error');
                // Reset button state
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.transform = 'scale(1)';
                btn.disabled = false;
            }
        }
        

        // Check for mode=register in URL
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('mode') === 'register') {
                switchTab('register');
            }
        });

        function mockSocialAuth() {
            showToast('Social authentication processing...', 'success');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        }
    </script>
<script src="js/notifications.js"></script>
</body>
</html>
