<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Skills - Level Up AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filters-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: var(--border-radius-md);
            border: 1px solid var(--border);
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .filter-group select, .filter-group input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: var(--border-radius-sm);
            outline: none;
        }

        .filter-group select:focus, .filter-group input:focus {
            border-color: var(--primary);
        }

        .skill-card {
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .skill-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
<script>
    if (localStorage.getItem('levelup_theme') === 'light' || (!localStorage.getItem('levelup_theme') && window.matchMedia('(prefers-color-scheme: light)').matches)) {
        document.body.classList.add('light-mode');
    }
</script>

    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">LevelUP<span>.AI</span></div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fa-solid fa-house"></i> Overview
                </a>
                <a href="learning.html" class="nav-item active">
                    <i class="fa-solid fa-book-open"></i> Learning
                </a>
                <a href="assessments.html" class="nav-item">
                    <i class="fa-solid fa-clipboard-check"></i> Practice
                </a>
                <a href="corporate.html" class="nav-item">
                    <i class="fa-solid fa-handshake"></i> Career
                </a>
            </nav>

            
            <div class="sidebar-footer" style="display: flex; justify-content: center; gap: 30px; padding: 20px 10px;">
                <a href="settings.html" class="nav-item" style="padding: 10px; margin: 0; min-width: auto;" title="Settings" aria-label="Settings">
                    <i class="fa-solid fa-gear" style="font-size: 1.2rem; color: var(--text-secondary); transition: var(--transition-fast);"></i>
                </a>
                <a href="#" class="nav-item" onclick="showToast('Help center opened');" style="padding: 10px; margin: 0; min-width: auto;" title="Help" aria-label="Help">
                    <i class="fa-solid fa-circle-question" style="font-size: 1.2rem; color: var(--text-secondary); transition: var(--transition-fast);"></i>
                </a>
                <a href="index.html" class="nav-item" style="padding: 10px; margin: 0; min-width: auto;" title="Logout" aria-label="Logout">
                    <i class="fa-solid fa-arrow-right-from-bracket" style="font-size: 1.2rem; color: var(--danger); transition: var(--transition-fast);"></i>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- Topbar (simplified for space) -->
            <header class="topbar">
                <div class="flex items-center gap-2">
                    <button class="hamburger-btn">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <button onclick="if(document.referrer) { history.back(); } else { window.location.href = 'dashboard.html'; }" class="back-btn" title="Go Back"><i class="fa-solid fa-arrow-left"></i> Back</button>
                    <h2>Explore Skills</h2>
                </div>
                <div class="topbar-right">
                    <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light/Dark Mode">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                    </button>
                    
                    <div class="notification-bell">
                        <i class="fa-solid fa-bell"></i>
                        <span class="notification-dot" style="display:none;"></span>
                        
                        <div class="dropdown-menu notif-dropdown" style="width: 320px; right: -80px;">
                            <div class="flex justify-between items-center" style="padding: 10px 15px; border-bottom: 1px solid var(--border)">
                                <strong style="color:var(--text-primary)">Notifications</strong>
                                <button onclick="markAllRead(event)" style="font-size:0.8rem; color:var(--primary); background:none; border:none; cursor:pointer;">Mark all read</button>
                            </div>
                            <div class="notification-list" style="max-height: 300px; overflow-y: auto;">
                            </div>
                        </div>
                    </div>
                    
                    <a href="profile.html" class="user-profile-menu" style="text-decoration: none;">
                        <div class="avatar" id="topAvatar">A</div>
                    </a>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="content-area">
                
                <!-- Filters -->
                <div class="filters-container">
                    <div class="filter-group" style="flex: 2;">
                        <label>Search</label>
                        <input type="text" id="searchSkill" placeholder="Search skills...">
                    </div>
                    <div class="filter-group">
                        <label>Category</label>
                        <select id="filterCategory">
                            <option value="All">All</option>
                            <option value="Programming">Programming</option>
                            <option value="Frontend">Frontend</option>
                            <option value="Backend">Backend</option>
                            <option value="AI/ML">AI/ML</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Cloud">Cloud</option>
                            <option value="Cyber Security">Cyber Security</option>
                            <option value="UI/UX">UI/UX</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Difficulty</label>
                        <select id="filterDifficulty">
                            <option value="All">All</option>
                            <option value="Beginner">Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Sort</label>
                        <select id="sortSkills">
                            <option value="Recommended">Recommended</option>
                            <option value="Popular">Popular</option>
                            <option value="A-Z">A-Z</option>
                        </select>
                    </div>
                    <div class="filter-group" style="justify-content: flex-end; flex: 0.5;">
                        <button class="btn-outline" id="clearFiltersBtn" style="padding: 10px;">Clear</button>
                    </div>
                </div>

                <!-- Skills Grid -->
                <div class="grid-3" id="skillsGrid">
                    <!-- Populated by JS -->
                </div>

                <!-- Empty State (Hidden by default) -->
                <div id="emptyState" class="hidden text-center mt-4">
                    <div style="font-size: 4rem; color: var(--text-muted); margin-bottom: 20px;">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                    </div>
                    <h3 class="mb-1">No Skills Found</h3>
                    <p class="text-secondary mb-3">Try changing your search or filters.</p>
                    <button class="btn-glow primary" onclick="document.getElementById('clearFiltersBtn').click()">Clear Filters</button>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/skills.js"></script>
<script src="js/notifications.js"></script>
</body>
</html>
